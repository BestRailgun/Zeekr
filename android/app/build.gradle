plugins { id 'com.android.application' }

android {
    namespace 'com.bestrailgun.zeeload'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.bestrailgun.zeeload'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes { release { minifyEnabled false } }
    def signingFile = System.getenv('ZEELOAD_KEYSTORE_FILE')
    if (signingFile) {
        signingConfigs.debug.storeFile = file(signingFile)
    }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES'] } }
    lint { abortOnError true; disable 'ObsoleteSdkInt' }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
