name: Build ZEELoad Android

on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', '.github/workflows/build-android-gui.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZEELOAD_KEYSTORE_FILE: ${{ github.workspace }}/android/.signing/zeeload-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: android/.signing/zeeload-debug.keystore
          key: zeeload-personal-debug-signing-v2
      - name: Prepare cached signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ZEELOAD_KEYSTORE_FILE" ]; then
            mkdir -p "$(dirname "$ZEELOAD_KEYSTORE_FILE")"
            keytool -genkeypair -storetype PKCS12 -keystore "$ZEELOAD_KEYSTORE_FILE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          test -s "$ZEELOAD_KEYSTORE_FILE"
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check real iptables test backends
        run: |
          iptables-legacy --version
          iptables-nft --version
      - name: Test, lint and build self-contained APK
        working-directory: android
        env:
          ZEELOAD_TEST_FIREWALL: '1'
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-output
          cp android/app/build/outputs/apk/debug/app-debug.apk android-output/ZEELoad-Android-0.1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-output/ZEELoad-Android-0.1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-output/ZEELoad-Android-0.1.2.apk > android-output/package-info.txt
          head -n 8 android-output/package-info.txt
          (cd android-output && sha256sum ZEELoad-Android-0.1.2.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZEELoad-Android-APK
          path: android-output/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
  launch:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZEELoad-Android-APK
          path: android-output
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android-output/ZEELoad-Android-0.1.2.apk
            adb shell pm grant com.bestrailgun.zeeload android.permission.POST_NOTIFICATIONS
            adb shell am start -W -n com.bestrailgun.zeeload/.MainActivity
            sleep 3
            adb shell pidof com.bestrailgun.zeeload
            adb shell uiautomator dump /sdcard/zeeload-window.xml
            adb pull /sdcard/zeeload-window.xml android-output/zeeload-window.xml
            adb exec-out screencap -p > android-output/ZEELoad-Android-preview.png
            adb logcat -d -s AndroidRuntime > android-output/android-runtime.txt
            if grep -q 'FATAL EXCEPTION' android-output/android-runtime.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-launch-check
          path: |
            android-output/*.png
            android-output/zeeload-window.xml
            android-output/android-runtime.txt
